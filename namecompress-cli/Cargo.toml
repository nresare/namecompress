[package]
name = "namecompress-cli"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command line encoder and decoder for namecompress"

[[bin]]
name = "namecompress"
path = "src/main.rs"

[dependencies]
namecompress.workspace = true
clap = { version = "4", features = ["derive"] }
zstd = "0.14"
xz2 = "0.1"
